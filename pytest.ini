[pytest]
testpaths = .
python_files = test_*.py
python_functions = test_*
addopts = -v
markers =
    smoke: Essential application checks
    regression: Tests checking existing functionality
    positive: Tests using valid input
    negative: Tests checking invalid input and error handling

;What these settings do:
;- testpaths = . — look for tests in the project root.
;- python_files = test_*.py — discover files beginning with test_.
;- python_functions = test_* — discover functions beginning with test_.
;- addopts = -v — show detailed test results by default.